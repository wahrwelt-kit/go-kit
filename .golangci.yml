version: "2"
linters:
  default: all
  disable:
    - wsl
    - wsl_v5
    - varnamelen
    - paralleltest
    - ireturn
    - depguard
    - lll
    - exhaustruct
    - exhaustruct_v5
    - err113
    - testpackage
    - gomodguard
    - nlreturn
    - noinlineerr
    - inamedparam
    - funcorder
    - godot
    - mnd
    - wrapcheck
    - tagliatelle
    - tagalign

  settings:
    cyclop:
      max-complexity: 25
    gocognit:
      min-complexity: 40
    funlen:
      lines: 100
      statements: 60

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - funlen
          - cyclop
          - errchkjson
          - gosec
          - nilnil
      - linters:
          - revive
        text: "context-as-argument"
      - path: examples/
        linters:
          - errcheck
          - gosec
          - gocritic

formatters:
  enable:
    - gofmt
    - goimports
